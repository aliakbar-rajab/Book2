name: Download Books

on:
  workflow_dispatch:
    inputs:
      book_url:
        description: 'Direct file URL only. HTML pages, ads.php, edition.php, and CAPTCHA pages are not supported.'
        required: true
        type: string
      expected_md5:
        description: 'Expected MD5 hash, optional but recommended'
        required: false
        type: string
      output_dir:
        description: 'Output directory'
        required: false
        default: 'downloads'
        type: string

permissions:
  contents: write

concurrency:
  group: download-books-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BOOK_URL: ${{ inputs.book_url }}
      EXPECTED_MD5: ${{ inputs.expected_md5 }}
      OUTPUT_DIR: ${{ inputs.output_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download file
        id: download
        run: |
          python3 --version
          python3 scripts/download.py

      - name: Upload artifact backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-book-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit and push downloaded file
        if: success()
        env:
          COMMIT_INPUT: ${{ inputs.book_url }}
        run: |
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "No output directory found."
            exit 0
          fi

          BIG_FILE="$(find "$OUTPUT_DIR" -type f -size +95M -print -quit)"
          if [ -n "$BIG_FILE" ]; then
            echo "::warning::File is larger than GitHub's normal git limit. It was uploaded as an artifact instead."
            echo "Large file: $BIG_FILE"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -- "$OUTPUT_DIR"

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          SAFE="$(printf '%s' "$COMMIT_INPUT" | tr -cd '[:print:]' | cut -c1-80)"
          git commit -m "📚 Download: ${SAFE}"

          BRANCH="${GITHUB_REF_NAME}"

          for i in 1 2 3 4 5; do
            echo "Push attempt $i/5..."
            git pull --rebase --autostash origin "$BRANCH" || true

            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed successfully."
              exit 0
            fi

            sleep $((i * 5))
          done

          echo "::warning::Push failed. File was uploaded as artifact."
          exit 0
